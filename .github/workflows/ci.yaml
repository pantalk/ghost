name: CI

on:
  push:
    branches:
      - main
      - next
    tags-ignore:
      - 'v*'
  pull_request:
    branches:
      - main
      - next

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate release metadata
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "VERSION is not valid semantic versioning: $VERSION" >&2
            exit 1
          fi

          if ! grep -q "^## \\[$VERSION\\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for $VERSION" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          push: false
          tags: pantalk/station:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail

          container="pantalk-station-ci"
          cleanup() {
            docker rm --force "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach \
            --name "$container" \
            --platform linux/amd64 \
            --shm-size 1g \
            --publish 127.0.0.1:6902:6901 \
            pantalk/station:ci

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:6902/index.html >/dev/null; then
              echo "Pantalk Station is ready"
              exit 0
            fi
            sleep 2
          done

          echo "Pantalk Station did not become ready within 120 seconds" >&2
          docker logs --tail 100 "$container" >&2 || true
          exit 1
