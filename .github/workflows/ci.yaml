name: CI

# Building and smoke-testing the image costs many minutes, so prose-only
# changes skip it. VERSION and CHANGELOG.md deliberately keep triggering CI
# because they express release intent.
on:
  push:
    branches:
      - main
      - next
    tags-ignore:
      - 'v*'
    paths-ignore:
      - 'README.md'
      - 'RELEASES.md'
      - 'IMAGE-SIZE.md'
      - 'deployments/**/*.md'
      - '.gitignore'
  pull_request:
    branches:
      - main
      - next
    paths-ignore:
      - 'README.md'
      - 'RELEASES.md'
      - 'IMAGE-SIZE.md'
      - 'deployments/**/*.md'
      - '.gitignore'

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate release metadata
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "VERSION is not valid semantic versioning: $VERSION" >&2
            exit 1
          fi

          if ! grep -q "^## \\[$VERSION\\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for $VERSION" >&2
            exit 1
          fi

      - name: Validate scripts and pinned metadata
        run: make check

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          push: false
          tags: pantalk/ghost:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail

          container="pantalk-ghost-ci"
          cleanup() {
            docker rm --force "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach \
            --name "$container" \
            --platform linux/amd64 \
            --shm-size 1g \
            --publish 127.0.0.1:6902:6901 \
            pantalk/ghost:ci

          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:6902/index.html >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done

          if [ "$ready" != "true" ]; then
            echo "Pantalk Ghost did not become ready within 120 seconds" >&2
            docker logs --tail 150 "$container" >&2 || true
            exit 1
          fi

          docker exec "$container" bash -ec '
            for command in agent-runtime-login ghost-panel-status \
              pantalk pantalkd agent-browser copilot cbk codex claude kimi \
              chromium; do
              command -v "$command" >/dev/null
            done
            ! command -v ergo >/dev/null
            ! command -v halloy >/dev/null
            ! command -v halloy-node >/dev/null
            curl -fsS http://127.0.0.1:6901/ >/dev/null
          '

          echo "Pantalk Ghost is ready and transport-neutral"
