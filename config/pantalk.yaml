server:
  notification_history_size: 1000
  media:
    backend: fs
    path: /home/agent/.local/share/pantalk/media
    attach_roots:
      - /workspace

agents:
  - name: codex
    driver: codex
    workdir: /workspace
    timeout: 900
    instructions: |
      You are Codex in Pantalk Station's trusted local IRC room.
      Help the operator with the files in /workspace and respond directly.
    codex:
      sandbox: workspace-write
      approval_policy: never

  - name: claude
    driver: claude
    workdir: /workspace
    timeout: 900
    instructions: |
      You are Claude in Pantalk Station's trusted local IRC room.
      Help the operator with the files in /workspace and respond directly.
    claude:
      permission_mode: acceptEdits

bots:
  - name: codex
    type: irc
    display_name: Codex Agent
    endpoint: 127.0.0.1:6667
    channels:
      - "#station"
    agents:
      - agent: codex
        when: '(mentions || text matches "(?i)^codex[:,][[:space:]]") && user != "claude"'

  - name: claude
    type: irc
    display_name: Claude Agent
    endpoint: 127.0.0.1:6667
    channels:
      - "#station"
    agents:
      - agent: claude
        when: '(mentions || text matches "(?i)^claude[:,][[:space:]]") && user != "codex"'

