# Pantalk Ghost terminal palette.
#
# Included from the kitty.conf generated by the shared desktop base. The UI
# colours below are the exact dark-theme tokens from site/styles/global.css:
#
#   #080A0C  background             #24DBC9  accent
#   #0F1215  background-secondary   #50E2D4  accent-secondary
#   #151A1E  background-tertiary    #FFFFFF  content
#   #1D2126  background-quaternary  #818C98  content-secondary
#   #282E33  stroke
#
# A terminal also needs distinct red, yellow, blue, and magenta channels that
# the two-colour Pantalk brand does not define. Those semantic ANSI colours are
# deliberately muted so the Pantalk teal remains the only product accent.

background            #080A0C
foreground            #FFFFFF
background_opacity    1.0

cursor                #24DBC9
cursor_text_color     #080A0C

selection_background  #24DBC9
selection_foreground  #080A0C

url_color             #50E2D4

active_border_color   #24DBC9
inactive_border_color #282E33
bell_border_color     #E07A8A

active_tab_background   #24DBC9
active_tab_foreground   #080A0C
inactive_tab_background #0F1215
inactive_tab_foreground #818C98

# black
color0  #0F1215
color8  #282E33
# red
color1  #C75E70
color9  #E07A8A
# green - Pantalk teal is the positive/status colour throughout the desktop
color2  #1EAB9D
color10 #24DBC9
# yellow
color3  #BEA85F
color11 #D9C579
# blue
color4  #5D88AD
color12 #7FA6C7
# magenta
color5  #9676A9
color13 #B396C3
# cyan
color6  #28AFA7
color14 #50E2D4
# white
color7  #818C98
color15 #FFFFFF

# The Ghost prompt requests 256-colour slot 46 for its @user accent. Remap the
# otherwise-neon-green slot to Pantalk teal.
color46 #24DBC9
