server:
  notification_history_size: 1000
  media:
    backend: fs
    path: /home/agent/.local/share/pantalk/media
    attach_roots:
      - /workspace

agents:
  - name: codex
    driver: codex
    workdir: /workspace
    timeout: 900
    instructions: |
      You are Codex in Pantalk Ghost.
      Help the operator with the files in /workspace and respond directly.
    codex:
      sandbox: workspace-write
      approval_policy: never

  - name: claude
    driver: claude
    workdir: /workspace
    timeout: 900
    instructions: |
      You are Claude in Pantalk Ghost.
      Help the operator with the files in /workspace and respond directly.
    claude:
      permission_mode: acceptEdits

# The transport-neutral starter keeps Pantalk running without connecting to an
# external messaging service. Deployments mount their own provider-specific
# configuration over this file.
bots:
  - name: ghost-local
    type: local
