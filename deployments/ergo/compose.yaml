name: pantalk-ergo

services:
  ergo:
    image: ${ERGO_IMAGE:-ghcr.io/ergochat/ergo:v2.19.0}
    init: true
    restart: unless-stopped
    ports:
      - ${ERGO_BIND_ADDRESS:-127.0.0.1}:${ERGO_PORT:-6667}:6667
    volumes:
      - ergo-data:/ircd
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'nc -z 127.0.0.1 6667',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  thelounge:
    image: ${THELOUNGE_IMAGE:-ghcr.io/thelounge/thelounge:4.5.2}
    restart: unless-stopped
    depends_on:
      ergo:
        condition: service_healthy
    ports:
      - ${THELOUNGE_BIND_ADDRESS:-127.0.0.1}:${THELOUNGE_PORT:-9000}:9000
    environment:
      IRC_CHANNEL: ${IRC_CHANNEL:-#ghost}
    volumes:
      - ./config/thelounge.js:/var/opt/thelounge/config.js:ro
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const r=require('http').get('http://127.0.0.1:9000/',x=>process.exit(x.statusCode<500?0:1));r.on('error',()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  ghost:
    profiles:
      - ghost
    image: ${GHOST_IMAGE:-ghcr.io/pantalk/ghost:0.0.10}
    restart: unless-stopped
    shm_size: 1gb
    depends_on:
      ergo:
        condition: service_healthy
    ports:
      - ${GHOST_BIND_ADDRESS:-127.0.0.1}:${GHOST_PORT:-6902}:6901
    environment:
      PANTALK_AUTOSTART: 'true'
      PANTALK_CONFIG: /home/ghost/.config/pantalk/config.yaml
      GHOST_RESOLUTION: ${GHOST_RESOLUTION:-1920x1080}
    volumes:
      - ./.state/pantalk:/home/ghost/.config/pantalk
      - ghost-state:/home/ghost/.local/share/pantalk
      - ghost-codex:/home/ghost/.codex
      - ghost-claude:/home/ghost/.claude
      - ghost-kimi:/home/ghost/.kimi
      - ghost-workspace:/workspace

volumes:
  ergo-data:
  ghost-state:
  ghost-codex:
  ghost-claude:
  ghost-kimi:
  ghost-workspace:
