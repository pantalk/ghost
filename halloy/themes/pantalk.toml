# Pantalk Station theme for Halloy.
# Black terminal-like surfaces with grayscale activity accents.

[general]
background = "#050505"
border = "#202020"
horizontal_rule = "#202020"
horizontal_rule_text = "#808080"
scrollbar = "#303030"
unread_indicator = "#f2f2f2"
highlight_indicator = "#ffffff"

[text]
primary = "#d8d8d8"
secondary = "#969696"
tertiary = "#707070"
success = "#d8d8d8"
error = "#f2f2f2"
warning = "#c0c0c0"
info = "#a8a8a8"
debug = "#808080"
trace = "#686868"

[buttons.primary]
background = "#050505"
background_hover = "#121212"
background_selected = "#1c1c1c"
background_selected_hover = "#282828"
border_active = "#d8d8d8"

[buttons.secondary]
background = "#0a0a0a"
background_hover = "#161616"
background_selected = "#1c1c1c"
background_selected_hover = "#282828"
border_active = "#d8d8d8"

[buffer]
action = "#d8d8d8"
background = "#000000"
background_text_input = "#080808"
background_title_bar = "#030303"
border = "#181818"
border_selected = "#d8d8d8"
code = "#b8b8b8"
highlight = "#282828"
nickname = "#d0d0d0"
nickname_offline = "#686868"
selection = "#383838"
timestamp = "#707070"
topic = "#989898"
url = "#f2f2f2"
backlog_rule = "#202020"
backlog_rule_text = "#707070"
date_rule = "#202020"
date_rule_text = "#707070"

[buffer.server_messages]
default = "#808080"
standard_reply_fail = "#f2f2f2"
standard_reply_warn = "#c0c0c0"
standard_reply_note = "#a8a8a8"

[formatting]
white = "#d8d8d8"
black = "#000000"
blue = "#909090"
green = "#989898"
red = "#a0a0a0"
brown = "#787878"
magenta = "#a8a8a8"
orange = "#888888"
yellow = "#b0b0b0"
lightgreen = "#b8b8b8"
cyan = "#989898"
lightcyan = "#c0c0c0"
lightblue = "#b0b0b0"
pink = "#b8b8b8"
grey = "#808080"
lightgrey = "#c8c8c8"
