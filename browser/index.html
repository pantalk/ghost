<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pantalk Station Browser</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: 'Noto Sans', 'Noto Color Emoji', sans-serif;
        background: #0a0a0a;
        color: #e5e7eb;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #171717 0%, #0a0a0a 60%);
      }
      main {
        width: min(760px, calc(100% - 48px));
        padding: 28px;
        border: 1px solid #262626;
        border-radius: 14px;
        background: rgba(10, 10, 10, 0.8);
      }
      h1 {
        margin: 0 0 10px;
        font-size: 1.5rem;
        font-weight: 600;
      }
      p {
        margin: 0;
        color: #a3a3a3;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Welcome to Pantalk Station</h1>
      <p>This is the default Chrome homepage for Pantalk Station sessions.</p>
    </main>
  </body>
</html>
